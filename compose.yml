services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_DB: ${POSTGRES_DB:-demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecretPassword123}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - demo_back
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 3


  api:
    build:
      context: ./api
      dockerfile: Dockerfile.multi
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:3000"
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-demo}
      PGDATABASE: ${POSTGRES_DB:-demo}
      PGPASSWORD: ${POSTGRES_PASSWORD:-SuperSecretPassword123}
    networks:
      - demo_front
      - demo_back
    depends_on:
      db:
        condition: service_started

  notifier:
    build:
      context: ./notifier
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3001
    networks:
      - demo_back
    depends_on:
      api:
        condition: service_started

networks:
  demo_front:
  demo_back:

volumes:
  pgdata:
